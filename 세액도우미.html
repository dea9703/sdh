<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물품 세액 정리 도우미</title>
<style>
/* ===== 모양(색·글씨) ===== */
body { font-family: "맑은 고딕", "Malgun Gothic", sans-serif; margin: 0; background: #f6f7f9; color: #222; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
h1 { font-size: 24px; margin: 8px 0 4px; }
.설명 { color: #555; font-size: 14px; margin: 4px 0; }
.상자 { background: #fff; border: 1px solid #dde1e6; border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.맨위 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
textarea { width: 100%; box-sizing: border-box; min-height: 160px; font-size: 16px; padding: 10px;
  border: 1px solid #c5ccd4; border-radius: 8px; font-family: inherit; }
button { font-size: 16px; padding: 9px 16px; border-radius: 8px; border: 1px solid #9aa5b1;
  background: #fff; cursor: pointer; margin: 8px 6px 0 0; font-family: inherit; }
button.주요 { background: #2f6fde; border-color: #2f6fde; color: #fff; font-weight: bold; }
.줄 { display: flex; gap: 10px; align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid #eef0f3; }
.줄:last-child { border-bottom: none; }
.줄.체크됨 { background: #f3f8f3; }
.줄 input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; cursor: pointer; }
.줄내용 { flex: 1; }
.물품 { font-weight: bold; font-size: 16px; }
.작게 { color: #666; font-size: 13px; }
.표시 { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: bold; margin-left: 6px; }
.표시.과세 { background: #e3edff; color: #1d4fb8; }
.표시.불공제 { background: #ffeedd; color: #b3540a; }
.표시.대상아님 { background: #e4e4e7; color: #27272a; }
.표시.면세 { background: #eceff2; color: #4a5560; }
.표시.확인필요 { background: #fff4c2; color: #7a5b00; }
.표시.오류 { background: #ffe0e0; color: #b00020; }
.계산 { margin-top: 4px; font-size: 15px; }
.알림 { margin-top: 4px; font-size: 13px; color: #7a5b00; }
.알림.오류 { color: #b00020; }
.매입 { margin-top: 4px; font-size: 14px; }
.매입 b { padding: 1px 8px; border-radius: 6px; margin-left: 4px; }
.매입 label { cursor: pointer; }
.줄 .매입 input[type=checkbox] { width: 17px; height: 17px; margin: 0 0 0 4px; vertical-align: -3px; }
.매입.가능 b { background: #dff3e4; color: #1b6b34; }
.매입.불가 b { background: #ffeedd; color: #b3540a; }
.매입.없음 b { background: #eceff2; color: #4a5560; }
.요약 { font-size: 15px; margin: 6px 0; }
table.합계 { border-collapse: collapse; margin-top: 8px; font-size: 15px; }
table.합계 th, table.합계 td { border: 1px solid #dde1e6; padding: 6px 12px; text-align: right; }
table.합계 th { background: #f0f3f6; }
.숨김 { display: none; }
.입력머리, .입력줄 { display: grid; grid-template-columns: 2fr 1.1fr 0.7fr 1.1fr 1.3fr auto; gap: 6px; align-items: center; }
.입력머리 { font-size: 13px; color: #555; font-weight: bold; padding: 0 2px 4px; }
.입력줄 { margin-bottom: 6px; }
.입력줄 input, .입력줄 select { width: 100%; box-sizing: border-box; font-size: 15px; padding: 7px 8px;
  border: 1px solid #c5ccd4; border-radius: 6px; font-family: inherit; background: #fff; }
.입력줄 input.숫자칸 { text-align: right; }
.입력줄 input.자동 { background: #f3f6fa; color: #445; }
.입력줄 button { margin: 0; padding: 6px 10px; font-size: 14px; }
.입력줄 .주차줄 { grid-column: 1 / -1; font-size: 14px; color: #555; display: flex; align-items: center; gap: 6px; }
.입력줄 .주차줄.숨김 { display: none; }
.입력줄 .주차줄 select { width: auto; min-width: 260px; }
@media (max-width: 640px) {
  .입력머리 { display: none; }
  .입력줄 { grid-template-columns: 1fr 1fr; padding: 8px; border: 1px solid #e3e6ea; border-radius: 8px; }
  .입력줄 .품목칸 { grid-column: 1 / -1; }
}
.탭줄 { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; border-bottom: 2px solid #dde1e6; padding-bottom: 8px; }
.탭줄 button { margin: 0; padding: 6px 12px; font-size: 14px; }
.탭줄 button.고름 { background: #2f6fde; border-color: #2f6fde; color: #fff; font-weight: bold; }
.항목 { margin-top: 4px; font-size: 14px; }
.항목 b { padding: 1px 8px; border-radius: 6px; background: #eef1ff; color: #3a3f9e; }

</head>
<body>
<!-- ===== 문제 알림: 이 인터넷 창에서 도구가 작동하지 않으면 맨 위에 안내를 띄움 ===== -->
<div id="문제알림" style="display:none;background:#ffe0e0;color:#b00020;padding:12px 16px;font-weight:bold;"></div>
<script>
window.onerror = function (메시지) {
  var 칸 = document.getElementById("문제알림");
  칸.style.display = "block";
  칸.textContent = "도구에서 예상하지 못한 문제가 생겼어요. 키보드 F5를 눌러 새로 고친 뒤 다시 해 보세요. 계속 뜨면 크롬이나 엣지(최신판)로 열어 주세요. (오류: " + 메시지 + ")";
};
</script>
<!-- ===== 화면 부분 ===== -->
<main>
  <div class="맨위">
    <div>
      <h1>물품 세액 정리 도우미</h1>
      <p class="설명">연습용 도구예요. 넣은 자료는 이 노트북 밖으로 나가지 않아요.</p>
    </div>
  </div>

  <div class="상자">
    <p class="설명">물품마다 한 줄씩 칸에 적어 주세요. <b>개당 가격</b>과 <b>개수</b>를 넣으면 <b>총 금액</b>은 자동으로 채워져요 (직접 고쳐도 돼요). 카드 종류는 줄마다 골라요.</p>
    <div class="입력표">
      <div class="입력머리"><span>품목</span><span>개당 가격(원)</span><span>개수</span><span>총 금액(원)</span><span>카드 종류</span><span></span></div>
      <div id="입력줄들"></div>
    </div>
    <button id="줄추가버튼">+ 줄 추가</button>
    <button class="주요" id="확인버튼">과세 여부 확인</button>
    <button id="예시버튼">예시 넣기</button>
    <button id="지우기버튼">지우기</button>
    <button id="연습버튼">연습 자료 불러오기</button>
    <input type="file" id="연습파일" accept=".csv,text/csv" class="숨김">
    <p class="설명">연습 자료: <code>연습자료/구매목록.csv</code>를 고르면 물품마다 카드 종류를 파일에서 읽고, 정답과 맞는지 ✅❌로 보여 줘요.</p>
  </div>

  <div class="상자 숨김" id="결과상자">
    <div class="탭줄" id="탭자리"></div>
    <div class="요약" id="요약"></div>
    <div id="목록"></div>
    <div id="합계자리"></div>
  </div>
</main>

    낱말: ["시내버스", "마을버스", "버스비", "지하철", "전철", "여객선", "배요금", "뱃삯"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (도서·신문·잡지)", 낱말: ["책", "도서", "신문", "잡지", "전자책"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (우표·인지 / 국가가 공급하는 우편 용역)", 낱말: ["우표", "수입인지", "인지대", "증지", "우편", "등기"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (금융·보험 용역)", 낱말: ["보험료"] },
  { 단계: 3, 구분: "면세", 근거: "부가가치세법 제26조 제1항 (도서관·박물관 등 입장)", 낱말: ["도서관", "박물관", "미술관"] },
];

// ===== LPG 주유소 예외 (기능 13) =====
// 품목에 이 낱말이 있으면 LPG 주유소로 보고, 에특카드(B)로 결제해도 불공제가 아닌 과세로 처리 (사용자 요청)
const LPG낱말 = ["LPG", "엘피지"];
function LPG인가(이름) {
  const t = String(이름 || "").replace(/\s+/g, "").toUpperCase();
  return LPG낱말.some(w => t.indexOf(w.toUpperCase()) >= 0);
}

// ===== 주차료 기준 (기능 12) =====
// 주차료는 이름이 같아도 주차장 종류에 따라 세금이 달라서 사람이 종류를 고름
const 주차종류목록 = [
  { 값: "민영", 이름: "일반 민영주차장", 구분: "과세", 근거: "일반 민영주차장 주차료는 과세 (10%)" },
  { 값: "공영직영", 이름: "공영주차장 (지자체 명의·계산 운영)", 구분: "면세", 근거: "국가·지자체가 공급하는 용역은 면세 (부가가치세법 제26조 제1항)",
    주의: "공영주차장은 운영 주체와 방식에 따라 달라요. 영수증의 사업자가 지자체인지 확인해 주세요" },
  { 값: "공영위탁", 이름: "민간위탁 공영주차장", 구분: "과세", 근거: "민간위탁 공영주차장은 위탁받은 사업자가 공급하므로 과세 (10%)",
    주의: "공영주차장은 운영 주체와 방식에 따라 달라요. 영수증의 사업자가 위탁 사업자인지 확인해 주세요" },
  { 값: "비영업용", 이름: "비영업용 소형승용차 주차료", 구분: "과세·불공제", 근거: "비영업용 소형승용자동차 유지 관련 매입세액은 불공제 (부가가치세법 제39조 제1항)" },
];
function 주차인가(이름) { return String(이름 || "").replace(/\s+/g, "").indexOf("주차") >= 0; }
// 처음 고른 값: 이름에 '공영'이 있으면 비워 둠(직영·위탁을 알 수 없으니까), 없으면 일반 민영
function 주차기본값(이름) { return String(이름 || "").indexOf("공영") >= 0 ? "" : "민영"; }
// 값('민영') 또는 이름('일반 민영주차장') 어느 쪽으로 적어도 찾음
function 주차종류찾기(글) {
  const t = String(글 || "").replace(/\s+/g, "");
  return 주차종류목록.filter(k => k.값 === t || k.이름.replace(/\s+/g, "") === t)[0] || null;
}

// 이름이 낱말과 맞는지 봄
function 낱말맞음(이름, 낱말, 안에만있어도) {
  if (낱말.length >= 2 || 안에만있어도) return 이름.replace(/\s+/g, "").toUpperCase().indexOf(낱말.toUpperCase()) >= 0;
  return 이름.split(/[\s,()\[\]\/·+]+/).indexOf(낱말) >= 0;
}

// 이름으로 구분·근거를 찾음. 같은 단계에서는 더 긴 낱말을 먼저 씀 ('도서관'이 '도서'보다 먼저)
// '○○맛' 표시 찾기 (기능 14): 맛 앞에 글자가 붙은 말(초코맛·딸기맛 등). '맛있는'·'맛없는'은 빼고 봄
function 맛표시찾기(이름) {
  const 찾음 = String(이름 || "").match(/[가-힣A-Za-z]+맛(?![있없])/);
  return 찾음 ? 찾음[0] : "";
}

// 생화·꽃의 원산지를 이름으로 살핌 (기능 15)
function 생화원산지살피기(이름, 고른것) {
  if (/수입/.test(이름)) return { 구분: "과세", 근거: "비식용 농산물 면세는 국내산만 → 수입 생화는 과세 (10%)", 주의: "", 낱말: 고른것.낱말 };
  if (/국내|국산/.test(이름)) return 고른것;
  return { 구분: "", 근거: "", 주의: "", 낱말: 고른것.낱말, 확인필요: "생화·꽃이 국내산인지 수입인지 품목에 적어 주세요 (예: 국내산 생화, 수입 생화). 국내산은 면세, 수입은 과세예요" };
}

function 구분찾기(물품이름) {
  const 이름 = String(물품이름 || "").trim();
  // ⓪ '○○맛'이 붙으면 '우유'·'딸기' 같은 면세 낱말이 있어도 가공품으로 보고 과세
  const 맛 = 맛표시찾기(이름);
  if (맛) return { 구분: "과세", 근거: "'○○맛' 표시가 있는 가공품(가공유 등)은 면세가 아님 (부가가치세법 제26조 제1항 제1호는 미가공 식료품만)", 주의: "", 낱말: 맛 };
  for (const 단계 of [1, 2, 3]) {
    let 고른것 = null;
    세금기준.filter(묶음 => 묶음.단계 === 단계).forEach(묶음 => {
      묶음.낱말.forEach(낱말 => {
        if (낱말맞음(이름, 낱말, 단계 === 1) && (!고른것 || 낱말.length > 고른것.낱말.length)) {
          고른것 = { 구분: 묶음.구분, 근거: 묶음.근거, 주의: 묶음.주의 || "", 낱말, 원산지: !!묶음.원산지 };
        }
      });
    });
    if (고른것) return 고른것.원산지 ? 생화원산지살피기(이름, 고른것) : 고른것;
  }
  return { 구분: "과세", 근거: "면세 기준에 없는 물품이라 과세로 봄", 주의: "", 낱말: "" };
}

// ===== 계산 규칙 =====
const 카드C_기준금액 = 500000; // 연습용 가상 값
const 금액상한 = 1000000000;    // 연습용 상한 10억 원. 넘으면 잘못 적은 것으로 보고 안내

// 물품 하나를 받아 세 칸(공급가액·세액·불공제세)을 정함
// 상태: "정상" / "오류"(넣은 값에 문제가 있음)
function 세액정하기(물품, 목록) {
  const 결과 = {
    구분: "", 공급가액: 0, 세액: 0, 불공제세: 0, 매입부가세: "–", 항목: "–",
    상태: "정상", 알림: [], 오류종류: "",
  };
  const 찾음 = 구분찾기(물품.물품이름);
  결과.구분 = 찾음.구분;
  결과.근거 = 찾음.근거 ? 찾음.근거 + (찾음.낱말 ? ` · 알아본 낱말: '${찾음.낱말}'` : "") : "";
  if (찾음.주의) 결과.알림.push("⚠️ 확인 필요: " + 찾음.주의);
  const 원산지필요 = 찾음.확인필요 || "";

  // 주차료: 낱말 대신 고른 주차장 종류로 판단
  let 주차고르기필요 = false;
  if (주차인가(물품.물품이름)) {
    const 글 = 물품.주차종류 == null ? 주차기본값(물품.물품이름) : 물품.주차종류;
    const 종류 = 주차종류찾기(글);
    결과.알림 = [];
    결과.주차장 = 종류 ? 종류.이름 : "";
    if (종류) {
      결과.구분 = 종류.구분;
      결과.근거 = 종류.근거;
      if (종류.주의) 결과.알림.push("⚠️ 확인 필요: " + 종류.주의);
    } else {
      결과.구분 = ""; 결과.근거 = "";
      주차고르기필요 = true;
    }
  }

  // 물품 이름이 없으면 계산하지 않음
  if (!String(물품.물품이름 || "").trim()) {
    결과.상태 = "오류"; 결과.오류종류 = "이름";
    결과.구분 = ""; 결과.근거 = ""; // 품목이 없으면 과세·면세를 판단하지 않음 (과세로 보이지 않게)
    결과.알림 = [];
    결과.알림.push("품목이 빠졌어요. 품목 칸에 물품 이름을 적어 주세요 (예: 복사용지)");
    return 결과;
  }

  // 넣은 숫자 살펴보기 (문제가 있으면 계산하지 않고 원인을 알려 줌)
  const 숫자문제 = 숫자살펴보기(물품);
  if (숫자문제) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push(숫자문제);
    return 결과;
  }

  // 총 금액 정하기
  let 총금액 = 물품.총금액;
  const 단가 = 물품.단가, 개수 = 물품.개수;
  if (총금액 == null && 단가 != null && 개수 != null) 총금액 = 단가 * 개수;
  if (총금액 == null) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push("금액이 빠졌어요. 개당 가격과 개수를 적거나, 총 금액 칸에 직접 적어 주세요");
    return 결과;
  }
  if (단가 != null && 개수 != null && 단가 * 개수 !== 총금액) {
    결과.상태 = "오류"; 결과.오류종류 = "금액";
    결과.알림.push(`금액 확인 필요: 개당 가격 × 개수 = ${금액글(단가 * 개수)}원인데 총 금액은 ${금액글(총금액)}원이에요`);
    return 결과;
  }
  결과.총금액 = 총금액;

  // 카드 확인
  const 카드 = String(물품.카드 || "").trim().toUpperCase();
  if (!카드) {
    결과.상태 = "오류"; 결과.오류종류 = "카드";
    결과.알림.push("카드 종류가 빠졌어요");
    return 결과;
  }
  if (!["A", "B", "C"].includes(카드)) {
    결과.상태 = "오류"; 결과.오류종류 = "카드";
    결과.알림.push(`카드 종류 '${카드}'를 모르겠어요 (A·B·C 중 하나)`);
    return 결과;
  }

  if (주차고르기필요) {
    결과.상태 = "확인 필요";
    결과.알림.push("주차장 종류를 골라 주세요. 공영주차장은 직영(면세)인지 민간위탁(과세)인지에 따라 세금이 달라요");
    return 결과;
  }
  if (원산지필요) {
    결과.상태 = "확인 필요";
    결과.알림.push(원산지필요);
    return 결과;
  }

  // 면세·과세대상 아님: 카드와 상관없이 공급가액 100% (부가세가 없음)
  if (결과.구분 === "면세" || 결과.구분 === "과세대상 아님") {
    결과.공급가액 = 총금액;
    결과.매입부가세 = 매입부가세정하기(결과);
    결과.항목 = 항목정하기(결과, 카드);
    return 결과;
  }

  const 공급가액 = Math.round(총금액 / 1.1);
  const 나머지 = 총금액 - 공급가액;
  결과.공급가액 = 공급가액;

  // LPG 주유소는 에특카드(B)로 결제해도 카드 A처럼 과세로 계산 (기능 13)
  let 계산카드 = 카드;
  if (카드 === "B" && 결과.구분 === "과세" && LPG인가(물품.물품이름)) {
    계산카드 = "A";
    결과.근거 = "LPG 주유소: 에특카드라도 과세로 처리 (사용자가 정한 업무 규칙)";
    결과.알림.push("LPG 주유소는 에특카드(B)라도 불공제가 아닌 과세로 처리했어요");
  }

  if (결과.구분 === "과세·불공제" || 계산카드 === "B") {
    결과.불공제세 = 나머지;               // 과세·불공제 + 모든 카드, 과세 + 에특카드(B: 정부보조금이라 환급 안 됨)
  } else {
    결과.세액 = 나머지;                   // 과세 + A 또는 C
    if (카드 === "C" && 총금액 > 카드C_기준금액) {
      결과.알림.push(`카드 C(하이브리드) 기준 금액(${금액글(카드C_기준금액)}원)을 넘어 카드 A(자체)처럼 계산했어요`);
    }
  }
  결과.매입부가세 = 매입부가세정하기(결과);
  결과.항목 = 항목정하기(결과, 계산카드);
  return 결과;
}

// 항목을 정함 (면세 → 면세, A → 매입부가세-카드, B → 매입부가세-불공제,
// C → 50만원 이하면 가지급금, 50만원 초과면 매입부가세-카드)
const 항목목록 = ["매입부가세-카드", "매입부가세-불공제", "가지급금", "면세", "과세대상 아님"];
function 항목정하기(결과, 카드) {
  if (결과.구분 === "면세") return "면세";
  if (결과.구분 === "과세대상 아님") return "과세대상 아님";
  if (카드 === "A") return "매입부가세-카드";
  if (카드 === "B") return "매입부가세-불공제";
  if (카드 === "C") return 결과.총금액 > 카드C_기준금액 ? "매입부가세-카드" : "가지급금";
  return "–";
}

// 매입부가세 대상인지 정함
// 가. 과세 + 공제 가능(세액 칸) → 대상 (공제 가능)
// 나. 과세 + 불공제(불공제세 칸, 과세·불공제 물품과 에특카드 포함) → 대상 (공제 불가)
// 다. 면세 / 라. 부가세가 없는 거래(세액·불공제세 모두 0원) → 해당없음
function 매입부가세정하기(결과) {
  if (결과.구분 === "면세" || 결과.구분 === "과세대상 아님") return "해당없음";
  if (결과.세액 > 0) return "대상 (공제 가능)";
  if (결과.불공제세 > 0) return "대상 (공제 불가)";
  return "해당없음";
}

// 1개 값·개수·총 금액 칸을 살펴보고, 문제가 있으면 안내 문구를 돌려줌 (없으면 "")
function 숫자살펴보기(물품) {
  // [칸 이름, 값, 이름 뒤에 붙는 말(이/가)]
  const 칸들 = [["개당 가격", 물품.단가, "이"], ["개수", 물품.개수, "가"], ["총 금액", 물품.총금액, "이"]];
  for (const [이름, 값, 조사] of 칸들) {
    if (값 == null) continue;
    if (isNaN(값)) return `${이름} 칸에 숫자가 아닌 글자가 있어요. 숫자만 적어 주세요 (예: 33000)`;
    if (값 < 0) return `${이름}${조사} 0보다 작아요 (마이너스). 맞게 적었는지 확인해 주세요`;
    if (값 % 1 !== 0) return `${이름}에 소수점이 있어요. ${이름 === "개수" ? "개수는" : "금액은"} 소수점 없이 적어 주세요`;
    if (값 === 0) return `${이름}${조사} 0이에요. 맞게 적었는지 확인해 주세요`;
    if (값 > 금액상한) return `${이름}${조사} 너무 커요 (${금액글(금액상한)}원 넘음). 0이 더 붙지 않았는지 확인해 주세요`;
  }
  return "";
}

function 금액글(n) { return Number(n).toLocaleString("ko-KR"); }

// 화면에 보이는 카드 이름 (계산은 A·B·C 영문자로 함)
const 카드이름표 = { A: "A(자체)", B: "B(에특)", C: "C(하이브리드)" };
function 카드이름(카드) { const k = String(카드).trim().toUpperCase(); return 카드이름표[k] || k; }

// ===== 화면 부분: 칸별 입력 표 (기능 10) =====
// 한 줄 = 품목 · 개당 가격 · 개수 · 총 금액 · 카드 종류(고르기) · 삭제
// 총 금액은 개당 가격 × 개수로 자동으로 채움. 직접 고치면 그 값을 씀 (다르면 '금액 확인 필요')
function 입력줄추가(값) {
  값 = 값 || {};
  const 줄 = 요소("div", "입력줄");
  const 칸 = (반, 안내, 글) => {
    const e = document.createElement("input");
    e.type = "text"; e.className = 반; e.placeholder = 안내; e.value = 글 == null ? "" : String(글);
    return e;
  };
  const 품목 = 칸("품목칸", "예: 복사용지", 값.이름);
  const 단가 = 칸("단가칸 숫자칸", "예: 5,500", 값.단가);
  const 개수 = 칸("개수칸 숫자칸", "예: 6", 값.개수);
  const 총액 = 칸("총액칸 숫자칸", "자동 계산", 값.총금액);
  [단가, 개수, 총액].forEach(e => e.setAttribute("inputmode", "numeric"));
  const 카드 = document.createElement("select");
  카드.className = "카드칸";
  ["A", "B", "C"].forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = 카드이름(k); 카드.appendChild(o); });
  카드.value = 값.카드 || "A"; // 새 줄은 A(자체)로 시작. 다른 카드면 그 줄에서 고름
  const 삭제 = 요소("button", null, "삭제");
  삭제.title = "이 줄 지우기";

  // 총 금액 자동 채우기
  const 곱 = () => {
    const a = 숫자로(단가.value), b = 숫자로(개수.value);
    return a != null && b != null && !isNaN(a) && !isNaN(b) ? a * b : null;
  };
  총액.dataset.직접 = 값.총금액 != null && 값.총금액 !== "" && 숫자로(값.총금액) !== 곱() ? "1" : "";
  const 자동표시 = () => 총액.classList.toggle("자동", 총액.dataset.직접 !== "1");
  const 자동채우기 = () => {
    if (총액.dataset.직접 === "1") return;
    const v = 곱();
    총액.value = v == null ? "" : 금액글(v);
  };
  단가.addEventListener("input", 자동채우기);
  개수.addEventListener("input", 자동채우기);
  총액.addEventListener("input", () => {
    총액.dataset.직접 = 총액.value.trim() ? "1" : "";
    if (!총액.value.trim()) 자동채우기();
    자동표시();
  });
  if (!값.총금액) 자동채우기();
  자동표시();

  // Enter를 누르면 다음 줄로 (마지막 줄이면 새 줄을 만듦)
  [품목, 단가, 개수, 총액, 카드].forEach(e => e.addEventListener("keydown", 이벤트 => {
    if (이벤트.key !== "Enter") return;
    이벤트.preventDefault();
    const 다음 = 줄.nextElementSibling || 입력줄추가();
    다음.querySelector(".품목칸").focus();
  }));
  삭제.addEventListener("click", () => {
    줄.remove();
    if (!document.querySelector("#입력줄들 .입력줄")) 입력줄추가();
  });

  // 주차장 종류: 품목에 '주차'가 들어가면 나타남
  const 주차칸 = 요소("label", "주차줄 숨김", "주차장 종류: ");
  const 주차 = document.createElement("select");
  주차.className = "주차칸";
  const 빈것 = document.createElement("option"); 빈것.value = ""; 빈것.textContent = "골라 주세요"; 주차.appendChild(빈것);
  주차종류목록.forEach(k => { const o = document.createElement("option"); o.value = k.값; o.textContent = k.이름; 주차.appendChild(o); });
  주차.dataset.직접 = 값.주차종류 != null ? "1" : "";
  if (값.주차종류 != null) 주차.value = (주차종류찾기(값.주차종류) || {}).값 || "";
  주차.addEventListener("change", () => { 주차.dataset.직접 = "1"; });
  주차칸.appendChild(주차);
  const 주차살피기 = () => {
    const 보임 = 주차인가(품목.value);
    주차칸.classList.toggle("숨김", !보임);
    if (보임 && 주차.dataset.직접 !== "1") 주차.value = 주차기본값(품목.value);
  };
  품목.addEventListener("input", 주차살피기);
  주차살피기();

  줄.append(품목, 단가, 개수, 총액, 카드, 삭제, 주차칸);
  document.getElementById("입력줄들").appendChild(줄);
  return 줄;
}


function 입력초기화(줄수) {
  document.getElementById("입력줄들").innerHTML = "";
  const 몇줄 = 줄수 == null ? 3 : 줄수; // 0이면 빈 줄 없이 시작 ([예시 넣기]에서 씀)
  for (let i = 0; i < 몇줄; i++) 입력줄추가();
}

// 입력 표를 읽어 물품 목록으로 만듦 (모든 칸이 빈 줄은 건너뜀)
function 입력줄읽기() {
  return [...document.querySelectorAll("#입력줄들 .입력줄")].map(줄 => {
    const 글 = 반 => 줄.querySelector("." + 반).value.trim();
    const 주차칸 = 줄.querySelector(".주차줄");
    return { 물품이름: 글("품목칸"), 단가글: 글("단가칸"), 개수글: 글("개수칸"), 총액글: 글("총액칸"), 카드: 줄.querySelector(".카드칸").value,
      주차종류: 주차칸 && !주차칸.classList.contains("숨김") ? 줄.querySelector(".주차칸").value : null };
  }).filter(r => r.물품이름 || r.단가글 || r.개수글 || r.총액글)
    .map(r => ({ 물품이름: r.물품이름, 단가: 숫자로(r.단가글), 개수: 숫자로(r.개수글), 총금액: 숫자로(r.총액글), 카드: r.카드, 주차종류: r.주차종류 }));
}

// ===== 화면 부분: 체크리스트 그리기 =====
let 지금줄들 = []; // [{물품, 결과, 정답비교}]
let 지금탭 = "전체";

// ===== 화면 부분: 항목별 탭 =====
function 탭맞음(줄) { return 지금탭 === "전체" || 줄.결과.항목 === 지금탭; }

function 탭그리기() {
  const 자리 = document.getElementById("탭자리");
  자리.innerHTML = "";
  ["전체"].concat(항목목록).forEach(탭 => {
    const 수 = 탭 === "전체" ? 지금줄들.length : 지금줄들.filter(줄 => 줄.결과.항목 === 탭).length;
    const 단추 = 요소("button", 탭 === 지금탭 ? "고름" : "", `${탭} (${수})`);
    단추.addEventListener("click", () => { 지금탭 = 탭; 탭적용(); });
    자리.appendChild(단추);
  });
}

function 탭적용() {
  지금줄들.forEach(줄 => 줄.칸.classList.toggle("숨김", !탭맞음(줄)));
  탭그리기();
  요약그리기();
}


function 요소(태그, 반, 글) {
  const e = document.createElement(태그);
  if (반) e.className = 반;
  if (글 != null) e.textContent = 글;
  return e;
}

function 표시요소(결과) {
  if (결과.상태 === "오류") return 요소("span", "표시 오류", "❗ 넣은 값 확인");
  if (결과.상태 === "확인 필요") return 요소("span", "표시 확인필요", "⚠️ 확인 필요");
  return null;
}

function 구분요소(구분) {
  const 그림 = { 과세: "🟦 과세", "과세·불공제": "🟧 과세·불공제", 면세: "⬜ 면세", "과세대상 아님": "⬛ 과세대상 아님" }[구분];
  const 반 = { 과세: "과세", "과세·불공제": "불공제", 면세: "면세", "과세대상 아님": "대상아님" }[구분];
  return 요소("span", "표시 " + 반, 그림);
}

function 계산글(결과) {
  if (결과.상태 !== "정상") return "";
  const 칸 = [`공급가액 ${금액글(결과.공급가액)}`];
  if (결과.세액) 칸.push(`세액 ${금액글(결과.세액)}`);
  if (결과.불공제세) 칸.push(`불공제세 ${금액글(결과.불공제세)}`);
  if (결과.구분 === "면세") 칸.push("면세라 공급가액 100%");
  if (결과.구분 === "과세대상 아님") 칸.push("과세대상이 아니라 공급가액 100%");
  return "→ " + 칸.join(" / ");
}

function 체크리스트그리기() {
  const 목록 = document.getElementById("목록");
  목록.innerHTML = "";
  지금줄들.forEach((줄, i) => {
    const 칸 = 요소("div", "줄");
    줄.칸 = 칸;
    const 체크 = document.createElement("input");
    줄.확인 = 체크;
    체크.type = "checkbox";
    체크.className = "확인체크";
    체크.title = "이 물품을 확인했으면 체크";
    체크.addEventListener("change", () => { 칸.classList.toggle("체크됨", 체크.checked); 요약그리기(); });
    칸.appendChild(체크);

    const 내용 = 요소("div", "줄내용");
    const 첫줄 = 요소("div");
    첫줄.appendChild(요소("span", "물품", `${i + 1}. ${줄.물품.물품이름 || "(이름 없음)"}`));
    if (줄.결과.구분) 첫줄.appendChild(구분요소(줄.결과.구분));
    const 상태 = 표시요소(줄.결과);
    if (상태) 첫줄.appendChild(상태);
    if (줄.정답비교) 첫줄.appendChild(요소("span", "표시 " + (줄.정답비교.맞음 ? "과세" : "오류"), 줄.정답비교.맞음 ? "✅ 정답과 맞음" : "❌ 정답과 다름"));
    내용.appendChild(첫줄);

    const 금액부분 = [];
    const 보일숫자 = n => n != null && !isNaN(n);
    if (보일숫자(줄.물품.단가) && 보일숫자(줄.물품.개수)) 금액부분.push(`1개 ${금액글(줄.물품.단가)}원 × ${줄.물품.개수}개`);
    else if (보일숫자(줄.물품.개수)) 금액부분.push(`${줄.물품.개수}개`);
    const 총 = 줄.결과.총금액 != null ? 줄.결과.총금액 : 줄.물품.총금액;
    if (보일숫자(총)) 금액부분.push(`총 ${금액글(총)}원`);
    금액부분.push(`카드 ${줄.물품.카드 ? 카드이름(줄.물품.카드) : "(없음)"}`);
    if (줄.결과.주차장) 금액부분.push(`주차장: ${줄.결과.주차장}`);
    if (줄.물품.날짜) 금액부분.push(줄.물품.날짜);
    내용.appendChild(요소("div", "작게", 금액부분.join(" · ")));

    if (줄.결과.근거) 내용.appendChild(요소("div", "작게", "근거: " + 줄.결과.근거));
    const 계산 = 계산글(줄.결과);
    if (계산) 내용.appendChild(요소("div", "계산", 계산));
    if (줄.결과.상태 === "정상") {
      const 항목칸 = 요소("div", "항목", "상대계정(대): ");
      항목칸.appendChild(요소("b", null, 줄.결과.항목));
      내용.appendChild(항목칸);
      내용.appendChild(매입부가세요소(줄));
    }
    줄.결과.알림.forEach(글 => 내용.appendChild(요소("div", "알림" + (줄.결과.상태 === "오류" ? " 오류" : ""), "· " + 글)));
    if (줄.정답비교 && !줄.정답비교.맞음) 내용.appendChild(요소("div", "알림 오류", "· 정답: " + 줄.정답비교.정답글));
    칸.appendChild(내용);
    목록.appendChild(칸);
  });
  document.getElementById("결과상자").classList.remove("숨김");
  지금탭 = "전체";
  탭적용();
}

// ===== 매입부가세 직접 체크·해제 =====
// 줄.매입직접: 없음(자동 그대로) / true(직접 체크) / false(직접 해제)
// 체크를 바꿔도 공급가액·세액·불공제세 숫자는 바뀌지 않음
function 매입값(줄) {
  const 자동 = 줄.결과.매입부가세;
  if (줄.매입직접 == null) return 자동;
  if (줄.매입직접 === false) return "해당없음";
  return 자동.indexOf("대상") === 0 ? 자동 : "대상 (직접 체크)";
}

function 매입부가세요소(줄) {
  const 값 = 매입값(줄);
  const 반 = 값 === "대상 (공제 가능)" ? "가능" : 값 === "해당없음" ? "없음" : "불가";
  const 칸 = 요소("div", "매입 " + 반);
  const 이름표 = document.createElement("label");
  이름표.appendChild(document.createTextNode("매입부가세: "));
  const 체크 = document.createElement("input");
  체크.type = "checkbox";
  체크.className = "매입체크";
  체크.title = "눌러서 직접 체크하거나 해제할 수 있어요";
  체크.checked = 값 !== "해당없음";
  체크.addEventListener("change", () => {
    const 자동대상 = 줄.결과.매입부가세.indexOf("대상") === 0;
    줄.매입직접 = 체크.checked === 자동대상 ? null : 체크.checked; // 자동과 같아지면 '직접 바꿈' 표시를 없앰
    칸.replaceWith(매입부가세요소(줄));
    요약그리기();
  });
  이름표.appendChild(체크);
  이름표.appendChild(요소("b", null, 값));
  칸.appendChild(이름표);
  if (줄.매입직접 != null) 칸.appendChild(요소("span", "작게", ` (직접 바꿈 · 자동 결과: ${줄.결과.매입부가세})`));
  return 칸;
}

function 요약그리기() {
  const 보이는줄 = 지금줄들.filter(탭맞음);
  const 체크수 = 보이는줄.filter(줄 => 줄.확인 && 줄.확인.checked).length;
  const 문제수 = 보이는줄.filter(줄 => 줄.결과.상태 !== "정상").length;
  let 글 = (지금탭 === "전체" ? "" : `[${지금탭}] `) + `물품 ${보이는줄.length}개 · 확인 ${체크수}/${보이는줄.length}`;
  if (문제수) 글 += ` · ⚠️❗ 살펴볼 물품 ${문제수}개`;
  const 비교 = 보이는줄.filter(줄 => 줄.정답비교);
  if (비교.length) 글 += ` · 정답과 맞음 ${비교.filter(줄 => 줄.정답비교.맞음).length}/${비교.length}`;
  document.getElementById("요약").textContent = 글;

  const 자리 = document.getElementById("합계자리");
  자리.innerHTML = "";
  if (!보이는줄.length) { if (지금줄들.length) 자리.appendChild(요소("p", "설명", "이 항목에 해당하는 물품이 없어요.")); return; }
  if (체크수 < 보이는줄.length) {
    자리.appendChild(요소("p", "설명", "모든 물품에 ☑ 체크하면 합계가 나와요."));
    return;
  }
  const 정상 = 보이는줄.filter(줄 => 줄.결과.상태 === "정상");
  const 합 = k => 정상.reduce((s, 줄) => s + 줄.결과[k], 0);
  const 표 = 요소("table", "합계");
  const 머리 = 요소("tr");
  ["", "공급가액", "세액", "불공제세", "총 금액"].forEach(t => 머리.appendChild(요소("th", null, t)));
  const 몸 = 요소("tr");
  [`합계 (${정상.length}개)`, 합("공급가액"), 합("세액"), 합("불공제세"), 합("총금액")]
    .forEach((v, i) => 몸.appendChild(요소(i ? "td" : "th", null, i ? 금액글(v) : v)));
  표.append(머리, 몸);
  자리.appendChild(요소("p", "요약", 지금탭 === "전체" ? "✅ 모두 확인했어요. 합계:" : `✅ [${지금탭}] 모두 확인했어요. 이 항목의 합계:`));
  자리.appendChild(표);
  const 건수 = 값 => 정상.filter(줄 => 매입값(줄) === 값).length;
  let 매입글 = `매입부가세: ☑ 대상 (공제 가능) ${건수("대상 (공제 가능)")}개 · ☑ 대상 (공제 불가) ${건수("대상 (공제 불가)")}개`;
  if (건수("대상 (직접 체크)")) 매입글 += ` · ☑ 대상 (직접 체크) ${건수("대상 (직접 체크)")}개`;
  매입글 += ` · ☐ 해당없음 ${건수("해당없음")}개`;
  const 직접수 = 정상.filter(줄 => 줄.매입직접 != null).length;
  if (직접수) 매입글 += ` (직접 바꾼 것 ${직접수}개)`;
  자리.appendChild(요소("p", "요약", 매입글));
  if (문제수) 자리.appendChild(요소("p", "알림", `· ⚠️❗ 표시된 ${문제수}개는 합계에 넣지 않았어요. 따로 확인해 주세요.`));
}

function 입력한목록확인() {
  const 물품들 = 입력줄읽기();
  if (!물품들.length) {
    지금줄들 = [];
    document.getElementById("목록").innerHTML = "";
    document.getElementById("합계자리").innerHTML = "";
    document.getElementById("탭자리").innerHTML = "";
    document.getElementById("요약").textContent =
      "⚠️ 적힌 물품이 없어요. 회색 글씨는 보기예요. 품목 칸부터 적거나 [예시 넣기]를 먼저 눌러 주세요.";
    document.getElementById("결과상자").classList.remove("숨김");
    return;
  }
  지금줄들 = 물품들.map(물품 => ({ 물품, 결과: 세액정하기(물품) }));
  체크리스트그리기();
}

// ===== 연습 자료 불러오기·정답 비교 =====
// 쉼표로 나눈 표 파일(CSV)을 읽음. 칸 이름은 연습자료/구매목록.csv와 같음
function CSV읽기(글) {
  const 줄들 = String(글 || "").replace(/^﻿/, "").split(/\r?\n/).filter(줄 => 줄.trim());
  if (!줄들.length) return null; // 빈 파일
  const 머리 = 줄들[0].split(",").map(t => t.trim());
  const 행들 = 줄들.slice(1).map(줄 => {
    const 칸 = 줄.split(",");
    const 행 = {};
    머리.forEach((이름, i) => { 행[이름] = (칸[i] || "").trim(); });
    return 행;
  });
  행들.머리 = 머리;
  return 행들;
}

// 구매목록 모양의 파일인지 살펴봄. 빠진 칸 이름을 돌려줌 (없으면 빈 목록)
function 빠진칸찾기(머리) {
  const 빠짐 = ["물품이름", "카드종류"].filter(k => 머리.indexOf(k) < 0);
  const 금액있음 = 머리.indexOf("총금액") >= 0 || (머리.indexOf("1개값") >= 0 && 머리.indexOf("구매개수") >= 0);
  if (!금액있음) 빠짐.push("총금액 (또는 1개값·구매개수)");
  return 빠짐;
}

function 숫자로(글) {
  const t = String(글 == null ? "" : 글).replace(/,/g, "").trim().replace(/(원|개)$/, ""); // '33,000원', '6개'도 숫자로 읽음
  return t === "" ? null : Number(t);
}

function 정답비교하기(행, 결과) {
  const 정답 = 행["정답_공급가액"];
  if (정답 == null || 정답 === "") return null; // 정답 칸이 없는 파일이면 비교하지 않음
  if (/^\d+$/.test(정답)) {
    const 칸들 = ["공급가액", "세액", "불공제세"];
    const 매입정답 = 행["정답_매입부가세"];
    const 같게 = t => String(t || "").replace(/\s+/g, "");
    const 맞음 = 결과.상태 === "정상" && 칸들.every(k => 결과[k] === Number(행["정답_" + k] || 0))
      && (!매입정답 || 같게(매입정답) === 같게(결과.매입부가세))
      && (!행["정답_항목"] || 같게(행["정답_항목"]) === 같게(결과.항목));
    let 정답글 = 칸들.map(k => `${k} ${금액글(Number(행["정답_" + k] || 0))}`).join(" / ");
    if (매입정답) 정답글 += ` / 매입부가세 ${매입정답}`;
    if (행["정답_항목"]) 정답글 += ` / 항목 ${행["정답_항목"]}`;
    return { 맞음, 정답글 };
  }
  let 맞음;
  if (정답.includes("금액")) 맞음 = 결과.오류종류 === "금액";
  else if (정답.includes("카드")) 맞음 = 결과.오류종류 === "카드";
  else 맞음 = 결과.상태 === "확인 필요";
  return { 맞음, 정답글: 정답 };
}

// 결과 칸을 비우고 안내 문구만 보여 줌 (파일에 문제가 있을 때)
function 안내만보여주기(글) {
  지금줄들 = [];
  document.getElementById("목록").innerHTML = "";
  document.getElementById("합계자리").innerHTML = "";
  document.getElementById("탭자리").innerHTML = "";
  document.getElementById("요약").textContent = "⚠️ " + 글;
  document.getElementById("결과상자").classList.remove("숨김");
}

function 연습자료보여주기(글) {
  const 행들 = CSV읽기(글);
  if (행들 === null) { 안내만보여주기("고른 파일이 비어 있어요. 연습자료/구매목록.csv처럼 물품이 적힌 파일을 골라 주세요."); return; }
  const 빠짐 = 빠진칸찾기(행들.머리);
  if (빠짐.length) {
    안내만보여주기(`구매목록 모양의 파일이 아니에요. 첫 줄에 이 칸이 없어요: ${빠짐.join(", ")}. 연습자료/구매목록.csv를 골랐는지 확인해 주세요.`);
    return;
  }
  if (!행들.length) { 안내만보여주기("파일에 물품이 하나도 없어요 (첫 줄의 칸 이름만 있어요). 둘째 줄부터 물품을 적어 주세요."); return; }
  지금줄들 = 행들.map(행 => {
    const 물품 = {
      물품이름: 행["물품이름"], 단가: 숫자로(행["1개값"]), 개수: 숫자로(행["구매개수"]),
      총금액: 숫자로(행["총금액"]), 카드: 행["카드종류"], 날짜: 행["구입날짜"],
      주차종류: 행["주차장종류"] ? 행["주차장종류"] : null, // 칸이 없거나 비면 처음 고른 값 규칙
    };
    const 결과 = 세액정하기(물품);
    return { 물품, 결과, 정답비교: 정답비교하기(행, 결과) };
  });
  체크리스트그리기();
}

document.getElementById("연습버튼").addEventListener("click", () => document.getElementById("연습파일").click());
document.getElementById("연습파일").addEventListener("change", 이벤트 => {
  const 파일 = 이벤트.target.files[0];
  if (!파일) return;
  const 읽개 = new FileReader();
  읽개.onload = () => {
    try { 연습자료보여주기(읽개.result); }
    catch (e) { 안내만보여주기("파일을 읽다가 문제가 생겼어요. 연습자료/구매목록.csv와 같은 모양의 파일인지 확인해 주세요."); }
  };
  읽개.readAsText(파일, "utf-8");
  이벤트.target.value = "";
});

document.getElementById("확인버튼").addEventListener("click", 입력한목록확인);
document.getElementById("줄추가버튼").addEventListener("click", () => 입력줄추가().querySelector(".품목칸").focus());

    { 이름: "항공권", 단가: 165000, 개수: 2, 카드: "C" },
    { 이름: "프린터용지 상자", 단가: 27500, 개수: 2, 카드: "B" },
    { 이름: "사무용 의자", 단가: 132000, 개수: 5, 카드: "C" },
    { 이름: "스테이플러", 단가: 6600, 개수: 2, 총금액: "15,400", 카드: "A" },

document.getElementById("지우기버튼").addEventListener("click", () => {
  입력초기화();
  지금줄들 = [];

입력초기화();
